{% extends "base.html" %}
{% block title %}{{ app_name }} | Kalkulator Keuangan Bisnis{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="calculator-card bg-white dark:bg-slate-800 rounded-lg shadow-lg p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mb-4">Kalkulator Keuangan Bisnis</h1>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Pendapatan Bulanan (Rp)</label>
        <input type="number" id="income" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2" placeholder="Masukkan pendapatan" min="0" inputmode="numeric" />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Pengeluaran Bulanan (Rp)</label>
        <input type="number" id="expenses" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2" placeholder="Masukkan pengeluaran" min="0" inputmode="numeric" />
      </div>

      <button id="calcBtn" class="calc-btn w-full bg-emerald-500 text-white font-bold py-2 rounded hover:bg-emerald-600 transition">
        Hitung
      </button>

      <div id="result" class="hidden rounded p-4 text-center"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("calcBtn").addEventListener("click", async function () {
    var income = parseFloat(document.getElementById("income").value);
    var expenses = parseFloat(document.getElementById("expenses").value);
    var result = document.getElementById("result");
    if (isNaN(income) || isNaN(expenses)) {
      showResult(result, '<p class="text-red-600 font-bold">Masukkan angka yang valid.</p>', true);
      return;
    }
    setLoading(this, true);
    try {
      var data = await apiPost("/api/v1/calculate/financial", { income: income, expenses: expenses });
      showResult(result, '<p class="text-lg font-bold text-emerald-700 dark:text-emerald-300">Keuntungan Bulanan: ' + data.formatted + "</p>");
    } catch (err) {
      showResult(result, '<p class="text-red-600 font-bold">' + err.message + "</p>", true);
    } finally {
      setLoading(this, false);
    }
  });
});
</script>
{% endblock %}
