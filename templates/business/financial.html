{% extends "base.html" %}
{% block title %}PolarPurse | Kalkulator Keuangan Bisnis{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-emerald-600 mb-4">Kalkulator Keuangan Bisnis</h1>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Pendapatan Bulanan (Rp)</label>
        <input type="number" id="income" class="w-full border rounded px-3 py-2" placeholder="Masukkan pendapatan" min="0" />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Pengeluaran Bulanan (Rp)</label>
        <input type="number" id="expenses" class="w-full border rounded px-3 py-2" placeholder="Masukkan pengeluaran" min="0" />
      </div>

      <button id="calcBtn" class="w-full bg-emerald-500 text-white font-bold py-2 rounded hover:bg-emerald-600 transition">
        Hitung
      </button>

      <div id="result" class="hidden bg-emerald-50 border border-emerald-300 rounded p-4 text-center">
        <p class="text-lg font-bold text-emerald-700" id="resultText"></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("calcBtn").addEventListener("click", async function () {
    const income = parseFloat(document.getElementById("income").value);
    const expenses = parseFloat(document.getElementById("expenses").value);
    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    if (isNaN(income) || isNaN(expenses)) {
      result.classList.remove("hidden");
      resultText.textContent = "Masukkan angka yang valid.";
      resultText.className = "text-lg font-bold text-red-600";
      return;
    }
    const data = await apiPost("/api/calculate/financial", { income, expenses });
    result.classList.remove("hidden");
    resultText.textContent = "Keuntungan Bulanan: " + data.formatted;
    resultText.className = "text-lg font-bold text-emerald-700";
  });
});
</script>
<script src="{{ url_for('static', filename='js/calculators.js') }}"></script>
{% endblock %}
