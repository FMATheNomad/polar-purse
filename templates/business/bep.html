{% extends "base.html" %}
{% block title %}{{ app_name }} | Kalkulator BEP{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="calculator-card bg-white dark:bg-slate-800 rounded-lg shadow-lg p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mb-4">Kalkulator Break Even Point</h1>
    <p class="text-sm text-slate-500 dark:text-slate-300 mb-4">
      Hitung berapa unit yang harus terjual untuk mencapai titik impas.
    </p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Biaya Tetap (Fixed Costs)</label>
        <input type="number" id="fixedCosts" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2" placeholder="Masukkan biaya tetap" min="0" inputmode="numeric" />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Biaya Variabel per Unit</label>
        <input type="number" id="variableCosts" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2" placeholder="Biaya produksi per unit" min="0" inputmode="numeric" />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Harga Jual per Unit</label>
        <input type="number" id="sellingPrice" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2" placeholder="Harga jual per unit" min="0" inputmode="numeric" />
      </div>

      <button id="calcBtn" class="calc-btn w-full bg-emerald-500 text-white font-bold py-2 rounded hover:bg-emerald-600 transition">
        Hitung
      </button>

      <div id="result" class="hidden rounded p-4 text-center"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.getElementById("calcBtn");
  var result = document.getElementById("result");

  btn.addEventListener("click", async function () {
    var fixed = parseFloat(document.getElementById("fixedCosts").value);
    var variable = parseFloat(document.getElementById("variableCosts").value);
    var price = parseFloat(document.getElementById("sellingPrice").value);

    if (!fixed || fixed <= 0 || !variable || variable < 0 || !price || price <= 0) {
      showResult(result, '<p class="text-red-600 font-bold">Masukkan semua angka yang valid.</p>', true);
      return;
    }
    setLoading(btn, true);
    try {
      var data = await apiPost("/api/v1/calculate/bep", {
        fixed_costs: fixed, variable_costs: variable, selling_price: price
      });
      showResult(result,
        '<p class="text-lg font-bold text-emerald-700 dark:text-emerald-300">BEP: ' + data.bep_units + ' unit</p>' +
        '<p class="text-sm text-slate-500 dark:text-slate-300 mt-1">Pendapatan pada BEP: ' + data.revenue_formatted + '</p>' +
        '<p class="text-sm text-slate-500 dark:text-slate-300">Margin kontribusi per unit: Rp ' + data.contribution_margin.toLocaleString("id-ID") + '</p>'
      );
    } catch (err) {
      showResult(result, '<p class="text-red-600 font-bold">' + err.message + "</p>", true);
    } finally {
      setLoading(btn, false);
    }
  });
});
</script>
{% endblock %}
