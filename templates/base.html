<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PolarPurse{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-200 min-h-screen flex flex-col">
  <header class="header shadow-lg w-full p-5 text-black fixed top-0 z-50">
    <nav class="p-1 flex justify-between items-center max-w-6xl mx-auto">
      <h1 class="font-extrabold text-emerald-500 text-2xl">
        <a href="/">PolarPurse</a>
      </h1>
      <div class="nav-btn text-base" onclick="toggleNav()">
        <i class="fa fa-bars text-3xl font-extrabold"></i>
      </div>
      <div class="nav-links fixed bg-slate-950 text-slate-300 w-40 p-2 rounded-b-lg">
        <div class="close-btn flex w-full justify-end">
          <i class="fa fa-times" onclick="toggleNav()"></i>
        </div>
        <div class="link-container flex flex-col">
          <a href="/" class="link p-2 hover:bg-emerald-500 hover:text-white rounded">Beranda</a>
          <a href="/#fitur" class="link p-2 hover:bg-emerald-500 hover:text-white rounded">Fitur</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 pt-20">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-950 text-slate-300 p-2">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-start p-4 gap-4">
      <div class="flex-1">
        <h3 class="font-bold text-emerald-400 mb-2">Team</h3>
        <ul class="space-y-1 text-sm">
          <li><i class="fab fa-github"></i> <span class="ml-1">fmathenomad</span></li>
          <li><i class="fab fa-github"></i> <span class="ml-1">ryugenxd</span></li>
        </ul>
      </div>
      <div class="flex-1">
        <h3 class="font-bold text-emerald-400 mb-2">Kontak</h3>
        <ul class="space-y-1 text-sm">
          <li><i class="fa fa-envelope"></i> <span class="ml-1">farizmuhammadaditya682@gmail.com</span></li>
          <li><i class="fa fa-envelope"></i> <span class="ml-1">yunanxd1@gmail.com</span></li>
        </ul>
      </div>
    </div>
    <div class="border-t border-slate-700 mt-2 pt-2 text-center text-xs">
      &copy; 2024 PolarPurse. All rights reserved.
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
