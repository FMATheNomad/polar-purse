{% extends "base.html" %}
{% block title %}{{ app_name }} | Alokasi Pendapatan{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="calculator-card bg-white dark:bg-slate-800 rounded-lg shadow-lg p-6 w-full max-w-lg">
    <h1 class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mb-2">{{ app_name }} — Kalkulator Alokasi Pendapatan</h1>
    <p class="text-sm text-slate-500 dark:text-slate-300 mb-4">
      Masukkan pendapatan, pilih alokasi, dan atur persentasenya.
    </p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Jumlah Pendapatan (Rp)</label>
        <input type="number" id="income" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2" placeholder="Contoh: 5000000" min="0" inputmode="numeric" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">Alokasi</label>
        <select id="allocType" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-3 py-2">
          <option value="saving">Menabung/Investasi</option>
          <option value="charity">Beramal</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-200">
          Persentase: <span id="percentDisplay" class="text-emerald-600 dark:text-emerald-400 font-bold">50%</span>
        </label>
        <input type="range" id="percentSlider" class="w-full" min="0" max="100" value="50" />
        <div class="flex justify-between text-xs text-slate-400">
          <span>0%</span><span>100%</span>
        </div>
      </div>

      <button id="calcBtn" class="calc-btn w-full bg-emerald-500 text-white font-bold py-2 rounded hover:bg-emerald-600 transition">
        Hitung
      </button>

      <div id="result" class="hidden rounded p-4 text-center"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var income = document.getElementById("income");
  var allocType = document.getElementById("allocType");
  var slider = document.getElementById("percentSlider");
  var display = document.getElementById("percentDisplay");
  var btn = document.getElementById("calcBtn");
  var result = document.getElementById("result");

  slider.addEventListener("input", function () {
    display.textContent = this.value + "%";
  });

  btn.addEventListener("click", async function () {
    var incomeVal = parseFloat(income.value);
    if (!incomeVal || incomeVal <= 0) {
      showResult(result, '<p class="text-red-600 font-bold">Masukkan jumlah pendapatan yang valid.</p>', true);
      return;
    }
    setLoading(btn, true);
    try {
      var data = await apiPost("/api/v1/calculate/alloc-income", {
        income: incomeVal,
        allocation_type: allocType.value,
        percentage: parseFloat(slider.value),
      });
      showResult(result, '<p class="text-lg font-bold text-emerald-700 dark:text-emerald-300">' +
        data.formatted + '</p><p class="text-sm text-slate-500 dark:text-slate-300 mt-1">' +
        data.percentage + '% untuk ' + data.allocation_label + "</p>");
    } catch (err) {
      showResult(result, '<p class="text-red-600 font-bold">' + err.message + "</p>", true);
    } finally {
      setLoading(btn, false);
    }
  });
});
</script>
{% endblock %}
